name: Task Validation

on:
  push:
    branches: [main, develop]
    paths:
      - "tasks/**"
      - "src/invariantlab/schema.py"
      - "src/invariantlab/tasks/validation.py"
      - "scripts/validate_task.py"
  pull_request:
    paths:
      - "tasks/**"
      - "src/invariantlab/schema.py"
      - "src/invariantlab/tasks/validation.py"
      - "scripts/validate_task.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/validate_task.py --task-dir tasks/
