name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests tasks scripts
      - run: uv run ruff format --check src tests tasks scripts
      - run: uvx cffconvert --validate -i CITATION.cff

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - if: matrix.python-version != '3.12'
        run: uv run pytest tests/ -v --ignore=tests/acceptance
      - if: matrix.python-version == '3.12'
        run: uv run pytest tests --cov=invariantlab --cov-report=term -v --ignore=tests/acceptance

  task-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [oscillator, kepler, heat1d, wave1d]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run pytest tests -q
        working-directory: tasks/${{ matrix.task }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run mypy src/invariantlab/

  acceptance:
    runs-on: ubuntu-latest
    needs: [lint, test, task-tests, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run pytest tests/acceptance/ -v
