# Ruff hooks pinned to the ruff version in uv.lock; paths mirror the CI lint job.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        files: ^(src|tests|tasks|scripts)/
      - id: ruff-format
        files: ^(src|tests|tasks|scripts)/
