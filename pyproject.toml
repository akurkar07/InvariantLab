[build-system]
requires = ["hatchling>=1.18", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "invariantlab"
dynamic = ["version"]
description = "Physics-grounded evaluation for AI-generated scientific software."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Alex Kurkar", email = "alex.kurkar@outlook.com" },
]
keywords = [
    "ai-evaluation",
    "scientific-software",
    "numerical-verification",
    "benchmark",
    "coding-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.87",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.5",
    "types-PyYAML>=6.0",
]
models = [
    "anthropic>=0.34",
    "openai>=1.40",
    "transformers>=4.40",
    "torch>=2.1",
    "vllm>=0.5",
]
export = [
    "datasets>=2.14",
    "huggingface-hub>=0.24",
]

[project.scripts]
invariantlab = "invariantlab.cli:app"

[project.urls]
Homepage = "https://github.com/akurkar07/InvariantLab"
Documentation = "https://github.com/akurkar07/InvariantLab/blob/main/docs/"
Repository = "https://github.com/akurkar07/InvariantLab"
Issues = "https://github.com/akurkar07/InvariantLab/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/invariantlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "TID", "NPY", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "S101"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = false
[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/invariantlab"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
