id: heat_ftcs
family: heat_1d
language: python
entrypoint: src/solver.py
public_tests: tests/public
scientific_tests: tests/scientific
output:
  path: result.npz
  arrays:
    - name: x
      shape: [null]
      dtype: float64
    - name: state
      shape: [null]
      dtype: float64
budgets:
  wall_seconds: 300
  model_tokens: 16000
numerics:
  dtype: float64
  seed: 42
  tolerances:
    state_relative_l2: 1.0e-5
description: |
  Implement a numerical solver for the 1-D heat equation u_t = α u_xx
  using the forward-time centred-space (FTCS) method with zero Dirichlet BCs.
