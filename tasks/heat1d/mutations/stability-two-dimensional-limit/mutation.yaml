id: stability-two-dimensional-limit
task_id: heat_ftcs
family: stability_error
interface: package
source: solver.py
expected_effect: >-
  Both FTCS stability guards use the 2-D limit r <= 0.25 instead of the 1-D limit r <= 0.5.
  Public cases (r of about 0.06) still run and the r=100 unstable input is still rejected,
  but the stable scientific case (r of about 0.34) is wrongly rejected at the process
  boundary with "FTCS stability requires r <= 0.25", so no archive is written.
expected_failures:
  - test: tests/scientific/test_reference.py::test_non_special_ftcs_case_matches_manufactured_solution_and_decays
    message: "FTCS stability requires r <= 0.25"
max_changed_lines: 8
