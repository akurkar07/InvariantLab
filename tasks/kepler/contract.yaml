id: kepler_verlet
family: kepler_two_body
language: python
entrypoint: src/solver.py
public_tests: tests/public
scientific_tests: tests/scientific
output:
  path: result.npz
  arrays:
    - name: time
      shape: [null]
      dtype: float64
    - name: state
      shape: [null, 4]
      dtype: float64
budgets:
  wall_seconds: 600
  model_tokens: 20000
numerics:
  dtype: float64
  seed: 1729
  tolerances:
    state_relative_l2: 1.0e-5
    energy_relative_drift: 1.0e-6
    angular_momentum_relative_drift: 1.0e-12
description: |
  Implement a numerical solver for the planar two-body Kepler problem
  d²r/dt² = -μ r/|r|³ using the velocity Verlet method.
