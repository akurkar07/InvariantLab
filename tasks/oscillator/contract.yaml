id: oscillator_verlet
family: oscillator
language: python
entrypoint: src/solver.py
public_tests: tests/public
scientific_tests: tests/scientific
output:
  path: result.npz
  arrays:
    - name: time
      shape: [null]
      dtype: float64
    - name: state
      shape: [null, 2]
      dtype: float64
budgets:
  wall_seconds: 300
  model_tokens: 16000
numerics:
  dtype: float64
  seed: 42
  tolerances:
    state_relative_l2: 1.0e-5
    energy_relative_drift: 1.0e-6
description: |
  Implement a numerical solver for the 1-D harmonic oscillator
  d²x/dt² = -ω²x using the velocity Verlet method.
